name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      otp:
        description: 'npm OTP (from authenticator app, required for publish since 2FA is enabled)'
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
      fail-fast: false

    defaults:
      run:
        working-directory: echo-prototype

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: echo-prototype/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: node bin/echoctl.js --version

      - name: Verify npm package (dry-run)
        run: npm pack --dry-run

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: echo-prototype

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: 'npm'
          cache-dependency-path: echo-prototype/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Publish to npm
        run: |
          OTP_FLAG=""
          if [ -n "${{ inputs.otp }}" ]; then
            OTP_FLAG="--otp=${{ inputs.otp }}"
          fi
          npm publish $OTP_FLAG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
